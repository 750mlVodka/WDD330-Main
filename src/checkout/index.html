<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
        <form id="checkout-form">
          <fieldset>
            <legend>Shipping</legend>
            <div class="checkout-field">
              <label for="fname">First Name:</label>
              <input type="text" name="fname" id="fname" required>
            </div>
            <div class="checkout-field">
              <label for="lname">Last Name:</label>
              <input type="text" name="lname" id="lname" required>
            </div>
            <div class="checkout-field">
              <label for="street">Street:</label>
              <input type="text" name="street" id="street" required>
            </div>
            <div class="checkout-field">
              <label for="city">City:</label>
              <input type="text" name="city" id="city" required>
            </div>
            <div class="checkout-field">
              <label for="state">State:</label>
              <input type="text" name="state" id="state" required>
            </div>
            <div class="checkout-field">
              <label for="zip">Zip:</label>
              <input type="text" name="zip" id="zip" required>
            </div>
          </fieldset>
          
          <fieldset>
            <legend>Payment</legend>
            <div class="checkout-field">
              <label for="cardNumber">Card Number:</label>
              <input type="text" name="cardNumber" id="cardNumber" required>
            </div>
            <div class="checkout-field">
              <label for="expiration">Expiration:</label>
              <input type="text" name="expiration" id="expiration" placeholder="MM/YY" required>
            </div>
            <div class="checkout-field">
              <label for="code">Security Code:</label>
              <input type="text" name="code" id="code" required>
            </div>
          </fieldset>

          <button type="submit" id="checkoutSubmit">Place Order</button>
        </form>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
